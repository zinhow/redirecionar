<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e3ead6; /* fundo verde claro */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Topo */
    .header {
      background-color: #cfe1b9;
      padding: 20px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #2e7d32;
    }

    .subheader {
      padding: 10px 40px;
      color: #2e7d32;
      font-size: 14px;
    }

    /* Card central */
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #ffffff;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .contador {
      font-size: 32px;
      font-weight: bold;
      color: #2e7d32;
      margin: 15px 0;
    }

    .info {
      font-size: 14px;
      color: #555;
    }

    /* Rodapé */
    .footer {
      background-color: #ffffff;
      padding: 10px 30px;
      font-size: 12px;
      color: #2e7d32;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>


  <div class="container">
    <div class="card">
      <h2>Redirecionando...</h2>
      <div class="contador" id="contador">5</div>
      <div class="info">
        Aguarde, você será direcionado automaticamente.
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Versão: 3.16.0</span>
    <span>Simples Nacional</span>
  </div>

  <script>
    let tempo = 5;
    const contadorEl = document.getElementById("contador");

    const intervalo = setInterval(() => {
      tempo--;
      contadorEl.textContent = tempo;

      if (tempo <= 0) {
        clearInterval(intervalo);
        window.location.href = "https://pg-meei.vercel.app/";
      }
    }, 1000);
  </script>

</body>
</html>
